name: Validate iOS

on:
  pull_request:
    paths:
      - 'ScanView3D/**'
      - '.github/workflows/**'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Storage regression tests and iOS builds
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26
        shell: bash
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          test -n "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - name: Storage failure-path tests
        env:
          EXPORT_FIXTURE_DIR: ${{ runner.temp }}/export-fixtures
        run: swift test --package-path ScanView3D/StorageCore
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exports with independent OpenUSD reader
        run: |
          python -m pip install usd-core==25.11
          python ScanView3D/Tests/verify_usdz.py "$RUNNER_TEMP/export-fixtures/aligned.usdz"
      - name: Compile device and simulator without signing
        shell: bash
        run: |
          set -o pipefail
          for SDK in iphoneos iphonesimulator; do
            # This is a compile check, not a simulator launch. Build the target
            # against each SDK without requiring an installed simulator runtime.
            xcodebuild -project ScanView3D/ScanView3D.xcodeproj \
              -target ScanView3D -configuration Debug -sdk "$SDK" \
              SYMROOT="$RUNNER_TEMP/ScanView3D-$SDK" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= PROVISIONING_PROFILE_SPECIFIER= \
              'SUPPORTED_PLATFORMS=iphoneos iphonesimulator' build \
              2>&1 | tee -a "$RUNNER_TEMP/validation.log"
          done
      - name: Capture native design previews
        if: github.ref == 'refs/heads/codex/design-system-upgrade' || github.head_ref == 'codex/design-system-upgrade'
        run: bash .github/scripts/design-screenshots.sh
      - name: Keep native design previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-design-previews
          path: ${{ runner.temp }}/design-screenshots
          if-no-files-found: ignore
      - name: Report compiler errors
        if: failure()
        shell: bash
        run: |
          grep -E 'error:|BUILD FAILED' "$RUNNER_TEMP/validation.log" 2>/dev/null | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done
      - name: Keep compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-validation-log
          path: ${{ runner.temp }}/validation.log
          if-no-files-found: ignore
